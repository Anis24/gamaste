<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Black vs Red</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --border: #e5e7eb;
      --black-die: #1b1b1f;
      --red-die: #c62828;
      --win: #16a34a;
      --lose: #dc2626;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111418;
        --card: #1a1f25;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #3b82f6;
        --accent-hover: #60a5fa;
        --border: #2a313a;
        --black-die: #0b0b0d;
        --win: #4ade80;
        --lose: #f87171;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      overflow: hidden;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .goal {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 0.875rem;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .side { display: flex; flex-direction: column; gap: 2px; }
    .side .who { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .side .score { font-size: 2.25rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .side .color { font-size: 0.8rem; color: var(--muted); min-height: 1.2em; }
    .vs { color: var(--muted); font-weight: 600; }

    .table {
      width: 100%;
      aspect-ratio: 16 / 10;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
      background: #2f5d4a;
    }

    .table canvas { display: block; }

    .result {
      font-size: 1rem;
      font-weight: 600;
      min-height: 1.5em;
      margin-bottom: 16px;
    }
    .result.win { color: var(--win); }
    .result.lose { color: var(--lose); }
    .result.tie, .result.idle { color: var(--muted); font-weight: 500; }

    .picks {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      font: inherit;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s, box-shadow 0.15s, opacity 0.15s;
    }

    button:disabled { opacity: 0.45; cursor: default; }

    .pick { border: 2px solid transparent; }
    .pick.black { background: var(--black-die); }
    .pick.red { background: var(--red-die); }
    .pick[aria-pressed="true"] {
      box-shadow: 0 0 0 3px var(--card), 0 0 0 6px var(--accent);
    }
    .pick[aria-pressed="true"]::before { content: "✓ "; }

    .roll { background: var(--accent); }
    .roll:not(:disabled):hover { background: var(--accent-hover); }

    .history {
      margin-top: 20px;
      text-align: left;
    }

    .history h2 {
      margin: 0 0 8px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .history ol {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 180px;
      overflow-y: auto;
      font-size: 0.85rem;
      font-variant-numeric: tabular-nums;
    }

    .history li {
      padding: 6px 0;
      border-top: 1px solid var(--border);
      color: var(--muted);
    }

    .history li.player { color: var(--win); }
    .history li.machine { color: var(--lose); }
    .history .empty { border: none; }

    .dot {
      display: inline-block;
      width: 0.7em;
      height: 0.7em;
      border-radius: 50%;
      margin-right: 2px;
      vertical-align: baseline;
    }
    .dot.black { background: var(--black-die); box-shadow: 0 0 0 1px var(--muted); }
    .dot.red { background: var(--red-die); }

    .hint {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.75rem;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      background: color-mix(in srgb, var(--card) 88%, transparent);
      backdrop-filter: blur(3px);
    }
    .overlay.show { display: flex; }
    .overlay h2 { margin: 0; font-size: 2rem; }
    .overlay p { margin: 0 0 8px; color: var(--muted); font-size: 1.1rem; }
    .overlay button { max-width: 240px; position: relative; z-index: 1; }

    .confetti {
      position: absolute;
      top: -12px;
      width: 8px;
      height: 14px;
      border-radius: 2px;
      animation: fall linear forwards;
      pointer-events: none;
    }

    @keyframes fall {
      to { transform: translateY(110vh) rotate(720deg); opacity: 0.8; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
      }
    }
  </script>
</head>
<body>
  <main class="card">
    <h1>Black vs Red</h1>
    <p class="goal">Pick a die, beat the machine's die, first to 21 wins.</p>

    <div class="scoreboard">
      <div class="side">
        <span class="who">You</span>
        <span class="score" id="playerScore">0</span>
        <span class="color" id="playerColor"></span>
      </div>
      <span class="vs">vs</span>
      <div class="side">
        <span class="who">Machine</span>
        <span class="score" id="machineScore">0</span>
        <span class="color" id="machineColor"></span>
      </div>
    </div>

    <div class="table" id="table"></div>

    <div class="result idle" id="result">Pick a side to start</div>

    <div class="picks">
      <button class="pick black" id="pickBlack" aria-pressed="false">Black</button>
      <button class="pick red" id="pickRed" aria-pressed="false">Red</button>
    </div>
    <button class="roll" id="roll" disabled>Roll the dice</button>

    <section class="history">
      <h2>History</h2>
      <ol id="history"><li class="empty">No rounds yet</li></ol>
    </section>
    <div class="hint">Tip: press Space or Enter to roll once a side is picked</div>

    <div class="overlay" id="overlay" role="dialog" aria-live="polite">
      <h2 id="overlayTitle"></h2>
      <p id="overlayScore"></p>
      <button class="roll" id="playAgain">Play again</button>
    </div>
  </main>

  <script type="module">
    import * as THREE from 'three';
    import * as CANNON from 'cannon-es';

    const tableEl = document.getElementById('table');
    const resultEl = document.getElementById('result');
    const historyEl = document.getElementById('history');
    const rollBtn = document.getElementById('roll');
    const pickBtns = {
      black: document.getElementById('pickBlack'),
      red: document.getElementById('pickRed')
    };
    const playerScoreEl = document.getElementById('playerScore');
    const machineScoreEl = document.getElementById('machineScore');
    const playerColorEl = document.getElementById('playerColor');
    const machineColorEl = document.getElementById('machineColor');
    const overlayEl = document.getElementById('overlay');
    const overlayTitleEl = document.getElementById('overlayTitle');
    const overlayScoreEl = document.getElementById('overlayScore');
    const playAgainBtn = document.getElementById('playAgain');

    const TARGET = 21;

    // Play area (half extents); invisible walls keep the dice in view
    const HALF_W = 3.2;
    const HALF_D = 2.1;
    const DIE_SIZE = 1;

    // ---------- Rendering ----------
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    tableEl.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(38, 16 / 10, 0.1, 100);
    camera.position.set(0, 11, 4);
    camera.lookAt(0, 0, 0);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x334433, 1.4));
    const sun = new THREE.DirectionalLight(0xffffff, 2.2);
    sun.position.set(3, 10, 4);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6 });
    sun.shadow.radius = 4;
    scene.add(sun);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.MeshStandardMaterial({ color: 0x2f5d4a, roughness: 0.95 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Which of the 9 grid cells show a pip for each face (0–8, row-major)
    const PIPS = {
      1: [4],
      2: [0, 8],
      3: [0, 4, 8],
      4: [0, 2, 6, 8],
      5: [0, 2, 4, 6, 8],
      6: [0, 2, 3, 5, 6, 8]
    };

    function faceTexture(value, faceColor, pipColor, edgeColor) {
      const size = 256;
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      ctx.fillStyle = edgeColor;
      ctx.fillRect(0, 0, size, size);
      ctx.fillStyle = faceColor;
      ctx.beginPath();
      ctx.roundRect(8, 8, size - 16, size - 16, 36);
      ctx.fill();
      ctx.fillStyle = pipColor;
      for (const cell of PIPS[value]) {
        const x = (cell % 3 + 1) * size / 4;
        const y = (Math.floor(cell / 3) + 1) * size / 4;
        ctx.beginPath();
        ctx.arc(x, y, 22, 0, Math.PI * 2);
        ctx.fill();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return tex;
    }

    // BoxGeometry face order: +x, -x, +y, -y, +z, -z (opposite faces sum to 7)
    const FACE_VALUES = [1, 6, 2, 5, 3, 4];
    const FACE_NORMALS = [
      new THREE.Vector3(1, 0, 0), new THREE.Vector3(-1, 0, 0),
      new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, -1, 0),
      new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 0, -1)
    ];
    const DIE_STYLES = {
      black: { face: '#1b1b1f', pip: '#f5f5f5', edge: '#0a0a0c', roughness: 0.3 },
      red:   { face: '#c62828', pip: '#111111', edge: '#8e1b1b', roughness: 0.35 }
    };
    function dieMaterials(style) {
      return FACE_VALUES.map(v => new THREE.MeshStandardMaterial({
        map: faceTexture(v, style.face, style.pip, style.edge),
        roughness: style.roughness
      }));
    }
    const dieGeometry = new THREE.BoxGeometry(DIE_SIZE, DIE_SIZE, DIE_SIZE);

    // ---------- Physics ----------
    const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -30, 0) });
    world.allowSleep = true;

    const tableMat = new CANNON.Material('table');
    const diceMat = new CANNON.Material('dice');
    world.addContactMaterial(new CANNON.ContactMaterial(tableMat, diceMat, { friction: 0.3, restitution: 0.45 }));
    world.addContactMaterial(new CANNON.ContactMaterial(diceMat, diceMat, { friction: 0.2, restitution: 0.4 }));

    function addPlane(position, euler) {
      const body = new CANNON.Body({ mass: 0, material: tableMat, shape: new CANNON.Plane() });
      body.position.set(...position);
      body.quaternion.setFromEuler(...euler);
      world.addBody(body);
    }
    addPlane([0, 0, 0], [-Math.PI / 2, 0, 0]);        // floor
    addPlane([-HALF_W, 0, 0], [0, Math.PI / 2, 0]);   // left wall
    addPlane([HALF_W, 0, 0], [0, -Math.PI / 2, 0]);   // right wall
    addPlane([0, 0, -HALF_D], [0, 0, 0]);             // back wall
    addPlane([0, 0, HALF_D], [0, Math.PI, 0]);        // front wall

    // dice[0] is black, dice[1] is red
    const dice = [['black', -1], ['red', 1]].map(([color, x]) => {
      const mesh = new THREE.Mesh(dieGeometry, dieMaterials(DIE_STYLES[color]));
      mesh.castShadow = true;
      scene.add(mesh);

      const half = DIE_SIZE / 2;
      const body = new CANNON.Body({
        mass: 1,
        material: diceMat,
        shape: new CANNON.Box(new CANNON.Vec3(half, half, half)),
        sleepSpeedLimit: 0.15,
        sleepTimeLimit: 0.3,
        linearDamping: 0.1,
        angularDamping: 0.1
      });
      body.position.set(x, half, 0);
      world.addBody(body);
      return { color, mesh, body };
    });

    function topFace(die) {
      const q = die.mesh.quaternion;
      let best = 0, bestY = -Infinity;
      FACE_NORMALS.forEach((n, i) => {
        const y = n.clone().applyQuaternion(q).y;
        if (y > bestY) { bestY = y; best = i; }
      });
      return FACE_VALUES[best];
    }

    // ---------- Game state ----------
    const game = {
      pick: null,          // 'black' | 'red' | null — the player's side for the next roll
      lastPick: null,      // side played in the most recent round, for the scoreboard
      playerScore: 0,
      machineScore: 0,
      rounds: [],
      gameOver: false
    };
    let rolling = false;
    let rollStart = 0;

    const otherSide = side => (side === 'black' ? 'red' : 'black');
    const cap = s => s[0].toUpperCase() + s.slice(1);

    function updateControls() {
      for (const [side, btn] of Object.entries(pickBtns)) {
        btn.disabled = rolling || game.gameOver;
        btn.setAttribute('aria-pressed', String(game.pick === side));
      }
      rollBtn.disabled = rolling || game.gameOver || game.pick === null;

      const shown = game.pick || game.lastPick;
      playerColorEl.textContent = shown ? cap(shown) : '';
      machineColorEl.textContent = shown ? cap(otherSide(shown)) : '';
      playerScoreEl.textContent = game.playerScore;
      machineScoreEl.textContent = game.machineScore;
    }

    function setResult(text, kind) {
      resultEl.textContent = text;
      resultEl.className = 'result ' + kind;
    }

    function pick(side) {
      if (rolling || game.gameOver) return;
      game.pick = side;
      setResult(`You play ${cap(side)}, machine plays ${cap(otherSide(side))}`, 'idle');
      updateControls();
    }

    function rand(min, max) {
      return min + Math.random() * (max - min);
    }

    function roll() {
      if (rollBtn.disabled) return;
      rolling = true;
      rollStart = performance.now();
      setResult('Rolling…', 'idle');
      updateControls();

      for (const { body } of dice) {
        body.wakeUp();
        // Leap up, drifting a little back toward the middle of the table
        body.velocity.set(
          -body.position.x * 0.8 + rand(-1.5, 1.5),
          rand(9, 12),
          -body.position.z * 0.8 + rand(-1.5, 1.5)
        );
        body.angularVelocity.set(rand(-20, 20), rand(-20, 20), rand(-20, 20));
      }
    }

    function finishRoll() {
      rolling = false;
      const black = topFace(dice[0]);
      const red = topFace(dice[1]);

      const winningSide = black > red ? 'black' : red > black ? 'red' : null;
      const points = winningSide ? Math.max(black, red) : 0;
      const winner = !winningSide ? 'tie' : winningSide === game.pick ? 'player' : 'machine';

      if (winner === 'player') game.playerScore += points;
      if (winner === 'machine') game.machineScore += points;

      game.rounds.unshift({
        round: game.rounds.length + 1,
        pick: game.pick,
        black, red, winner, points,
        playerScore: game.playerScore,
        machineScore: game.machineScore
      });

      const faces = `Black ${black} vs Red ${red}`;
      if (winner === 'player') setResult(`${faces} — you win +${points}`, 'win');
      else if (winner === 'machine') setResult(`${faces} — machine wins +${points}`, 'lose');
      else setResult(`${faces} — tie, no points`, 'tie');

      game.lastPick = game.pick;
      game.pick = null;
      if (game.playerScore >= TARGET || game.machineScore >= TARGET) endGame();

      renderHistory();
      updateControls();
    }

    function renderHistory() {
      if (!game.rounds.length) {
        historyEl.innerHTML = '<li class="empty">No rounds yet</li>';
        return;
      }
      historyEl.innerHTML = game.rounds.map(r => {
        const outcome = r.winner === 'tie' ? 'Tie'
          : `${r.winner === 'player' ? 'You' : 'Machine'} +${r.points}`;
        return `<li class="${r.winner}">#${r.round} · You: ${cap(r.pick)} · ` +
          `<span class="dot black"></span>${r.black} vs <span class="dot red"></span>${r.red} · ` +
          `${outcome} · ${r.playerScore}–${r.machineScore}</li>`;
      }).join('');
    }

    function endGame() {
      game.gameOver = true;
      const playerWon = game.playerScore >= TARGET;
      overlayTitleEl.textContent = playerWon ? 'You win! 🎉' : 'Machine wins';
      overlayScoreEl.textContent = `Final score ${game.playerScore}–${game.machineScore}`;
      overlayEl.classList.add('show');
      if (playerWon) confetti();
      playAgainBtn.focus();
    }

    function confetti() {
      const colors = ['#1b1b1f', '#c62828', '#f59e0b', '#2563eb', '#16a34a', '#ec4899'];
      for (let i = 0; i < 80; i++) {
        const piece = document.createElement('span');
        piece.className = 'confetti';
        piece.style.left = rand(0, 100) + '%';
        piece.style.background = colors[i % colors.length];
        piece.style.animationDuration = rand(1.6, 3) + 's';
        piece.style.animationDelay = rand(0, 0.6) + 's';
        piece.style.transform = `rotate(${rand(0, 360)}deg)`;
        overlayEl.appendChild(piece);
        piece.addEventListener('animationend', () => piece.remove());
      }
    }

    function resetGame() {
      Object.assign(game, {
        pick: null, lastPick: null, playerScore: 0, machineScore: 0, rounds: [], gameOver: false
      });
      overlayEl.classList.remove('show');
      overlayEl.querySelectorAll('.confetti').forEach(p => p.remove());
      setResult('Pick a side to start', 'idle');
      renderHistory();
      updateControls();
    }

    function isSettled() {
      return dice.every(({ body }) =>
        body.sleepState === CANNON.Body.SLEEPING ||
        (body.velocity.length() < 0.05 && body.angularVelocity.length() < 0.05)
      );
    }

    pickBtns.black.addEventListener('click', () => pick('black'));
    pickBtns.red.addEventListener('click', () => pick('red'));
    rollBtn.addEventListener('click', roll);
    playAgainBtn.addEventListener('click', resetGame);
    document.addEventListener('keydown', e => {
      // A just-clicked pick button keeps focus, so let Space/Enter roll from there too
      const fromPick = e.target === pickBtns.black || e.target === pickBtns.red;
      if ((e.code === 'Space' || e.code === 'Enter') && (e.target === document.body || fromPick)) {
        e.preventDefault();
        roll();
      }
    });

    // ---------- Loop ----------
    function resize() {
      const { clientWidth: w, clientHeight: h } = tableEl;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    new ResizeObserver(resize).observe(tableEl);
    resize();

    let last = performance.now();
    function animate(now) {
      const dt = Math.min((now - last) / 1000, 0.1);
      last = now;
      world.step(1 / 60, dt, 5);

      for (const { mesh, body } of dice) {
        mesh.position.copy(body.position);
        mesh.quaternion.copy(body.quaternion);
      }

      if (rolling) {
        const elapsed = now - rollStart;
        if ((elapsed > 400 && isSettled()) || elapsed > 8000) finishRoll();
      }

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    updateControls();
  </script>
</body>
</html>
